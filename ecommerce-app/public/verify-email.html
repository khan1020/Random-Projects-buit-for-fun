<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - MyStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyStore</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Verify Your Email</h2>
                        
                        <div id="verification-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="token" class="form-label">Verification Code</label>
                                <input type="text" class="form-control" id="token" required placeholder="Enter the code from your email">
                            </div>
                            
                            <button onclick="verifyEmail()" class="btn btn-primary w-100">Verify Email</button>
                        </div>

                        <div class="text-center mt-3">
                            <button onclick="resendVerification()" class="btn btn-link">Resend Verification Code</button>
                        </div>

                        <div id="verification-message" class="alert mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        async function verifyEmail() {
            const email = document.getElementById('email').value;
            const token = document.getElementById('token').value;
            const messageDiv = document.getElementById('verification-message');

            try {
                const response = await axios.post('/api/auth/verify-email', {
                    email,
                    token
                });

                showMessage(messageDiv, response.data.message, 'success');
                
                // Store token and redirect after delay
                setTimeout(() => {
                    localStorage.setItem('token', response.data.token);
                    localStorage.setItem('user', JSON.stringify(response.data.user));
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                const errorMessage = error.response?.data?.message || 'Verification failed';
                showMessage(messageDiv, errorMessage, 'danger');
            }
        }

        async function resendVerification() {
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('verification-message');

            if (!email) {
                showMessage(messageDiv, 'Please enter your email address', 'warning');
                return;
            }

            try {
                const response = await axios.post('/api/auth/resend-verification', { email });
                showMessage(messageDiv, response.data.message, 'success');
            } catch (error) {
                const errorMessage = error.response?.data?.message || 'Failed to resend verification';
                showMessage(messageDiv, errorMessage, 'danger');
            }
        }

        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = `alert alert-${type}`;
            element.style.display = 'block';
        }

        // Auto-fill email from URL parameters
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            if (email) {
                document.getElementById('email').value = email;
            }
        });
    </script>
</body>
</html>
