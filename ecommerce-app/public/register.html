<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MyStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyStore</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="cart.html">Cart</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Create Account</h2>
                        
                        <!-- Registration Form -->
                        <form id="register-form">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                                <div class="form-text">Password must be at least 6 characters long.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="confirm-password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm-password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 btn-lg">Create Account</button>
                        </form>

                        <!-- OTP Verification Form (Initially Hidden) -->
                        <div id="otp-verification" style="display: none;">
                            <h5 class="text-center mb-3">Verify Your Email</h5>
                            <p class="text-center">We've sent a 6-digit verification code to your email.</p>
                            
                            <!-- OTP Input -->
                            <div class="mb-3">
                                <label for="otp-code" class="form-label">Enter OTP Code</label>
                                <input type="text" class="form-control text-center" id="otp-code" maxlength="6" 
                                       placeholder="Enter 6-digit code" style="font-size: 1.2rem; letter-spacing: 8px;">
                                <div class="form-text text-center">Check your email for the verification code</div>
                            </div>
                            
                            <!-- Timer Display -->
                            <div class="text-center mb-3">
                                <div id="timer-container" style="display: none;">
                                    <p class="text-muted">OTP expires in: 
                                        <span id="countdown-timer" class="fw-bold text-danger">60</span> seconds
                                    </p>
                                </div>
                                <div id="otp-expired" style="display: none;">
                                    <p class="text-danger fw-bold">OTP has expired!</p>
                                </div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="d-grid gap-2">
                                <button onclick="verifyOTP()" class="btn btn-success btn-lg">Verify Email</button>
                                <button onclick="resendOTP()" class="btn btn-outline-primary" id="resend-btn" disabled>
                                    Resend OTP (<span id="resend-timer">60</span>s)
                                </button>
                                <button onclick="cancelVerification()" class="btn btn-outline-secondary">Cancel Registration</button>
                            </div>
                        </div>
                        
                        <div class="text-center mt-3">
                            <p>Already have an account? <a href="login.html">Login here</a></p>
                        </div>

                        <div id="register-message" class="alert mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
